{% extends "base.html" %}

{% block title %}{{ recipe.name }}{% endblock %}
{% block page_heading %}{{ recipe.name }}{% endblock %}

{% block content %}
<p>Author: {{ recipe.author.name }}</p>
<ul>
  {% for item in ingredients %}
    <li>{{ item.name }} - {{ item.quantity }}</li>
  {% endfor %}
</ul>
{% endblock %}
